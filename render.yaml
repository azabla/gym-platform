# Render Blueprint for the staging deploy (ADR 0020).
# In Render: New > Blueprint, pick this repository and the "deployment" branch.
# Values marked "sync: false" are asked for once in the dashboard and never committed.
# The database is on Neon (neon.tech), outside Render; see ADR 0020.

services:
  - type: web
    name: gym-platform
    runtime: docker
    plan: free
    region: frankfurt
    branch: deployment
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Gym Platform
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate with: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Left empty, start.sh uses the onrender.com address Render gives the service.
      - key: APP_URL
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      # Neon's direct (not pooled) connection string, ending in ?sslmode=require.
      - key: DB_URL
        sync: false

      # Render allows one free Key Value per workspace, so staging keeps
      # sessions, cache and the queue in Postgres instead of Redis.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Cloudflare R2 through the s3 disk. The endpoint is
      # https://<account id>.r2.cloudflarestorage.com; AWS_URL is the bucket's public URL.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      # A second, private R2 bucket for the nightly database dumps; never the public one above (ADR 0028).
      - key: BACKUP_AWS_BUCKET
        sync: false

      # Messages go to the log until the real accounts are connected. To go live,
      # fill in the account below and switch the driver (docs/development-setup.md).
      - key: MAIL_MAILER
        value: log
      - key: SMS_DRIVER
        value: log
      - key: AFROMESSAGE_TOKEN
        sync: false
      - key: AFROMESSAGE_IDENTIFIER_ID
        sync: false
      - key: AFROMESSAGE_SENDER_NAME
        sync: false
      - key: PUSH_DRIVER
        value: log
      - key: FCM_PROJECT_ID
        sync: false
      # The service account's JSON key, base64-encoded: Render has no disk for the file.
      - key: FCM_CREDENTIALS_JSON
        sync: false
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1

      # Unhandled errors go to Sentry once this is filled in; empty sends nothing.
      - key: SENTRY_LARAVEL_DSN
        sync: false

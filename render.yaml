# Render Blueprint for the staging deploy (ADR 0020).
# In Render: New > Blueprint, pick this repository and the "deployment" branch.
# Values marked "sync: false" are asked for once in the dashboard and never committed.

services:
  - type: web
    name: gym-platform
    runtime: docker
    plan: free
    region: frankfurt
    branch: deployment
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Gym Platform
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate with: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Left empty, start.sh uses the onrender.com address Render gives the service.
      - key: APP_URL
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: gym-db
          property: connectionString

      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gym-redis
          property: connectionString
      - key: SESSION_DRIVER
        value: redis
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis

      # Cloudflare R2 through the s3 disk. The endpoint is
      # https://<account id>.r2.cloudflarestorage.com; AWS_URL is the bucket's public URL.
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # Messages go to the log until the real accounts are connected.
      - key: MAIL_MAILER
        value: log
      - key: SMS_DRIVER
        value: log
      - key: PUSH_DRIVER
        value: log
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1

  - type: keyvalue
    name: gym-redis
    plan: free
    region: frankfurt
    # Queued jobs must never be evicted to make room.
    maxmemoryPolicy: noeviction
    # Empty: reachable only from services in this Render account.
    ipAllowList: []

databases:
  - name: gym-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: gym
    user: gym

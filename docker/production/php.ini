; Production PHP settings (ADR 0020): code never changes inside the image,
; so OPcache never checks files for changes.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 25M

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

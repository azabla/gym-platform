; Production PHP settings, layered on top of php.ini-production.

; Canonical time is UTC (see ADR 0001).
date.timezone = UTC

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M

; Code never changes inside a running container, so never re-check files.
opcache.enable = 1
opcache.validate_timestamps = 0

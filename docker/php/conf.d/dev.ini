; Development-only PHP settings. Production gets its own, stricter file.

; Canonical time is UTC (see ADR 0001 and the architecture notes).
; Africa/Addis_Ababa is applied only when displaying dates.
date.timezone = UTC

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M

display_errors = On
error_reporting = E_ALL

; Re-check files on every request so code changes show up immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
